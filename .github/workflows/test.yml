name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # The release build runs these first: a tag publishes nothing they fail.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install ruff==0.6.9
      - run: ruff check server tools tests

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          # The Python mypy.ini checks for: on a newer one pip brings libraries
          # whose stubs use syntax 3.10 does not have, which mypy then refuses.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements.txt
      # The server's own libraries, so their types are checked against; settings in server/mypy.ini.
      - run: pip install -r server/requirements.txt mypy==1.13.0
      - working-directory: server
        run: mypy .

  backend:
    # Linux jobs keep their original names, which branch protection may require.
    name: Backend (Python ${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          # Windows Server 2022 is built from the Windows 10 code base, 2025
          # from Windows 11's, so between them they stand in for both.
          - os: windows-2022
            python-version: '3.12'
          - os: windows-2025
            python-version: '3.12'

    env:
      COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && 'yes' || 'no' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # The test suite mocks the Cyphal stack, so it needs neither the DSDL
        # submodule nor compiled types. Skipping the submodule keeps this fast.

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Run test suite
        working-directory: server
        env:
          # Matches the documented local command: stops third-party plugins
          # (notably ROS2's) from being auto-loaded into the run.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/ -v -p pytest_asyncio.plugin ${{ env.COVERAGE == 'yes' && '-p pytest_cov --cov=.' || '' }}

      - name: Coverage report
        # One leg measures it, for the job summary; no threshold fails a run yet.
        if: env.COVERAGE == 'yes'
        working-directory: server
        run: python -m coverage report --format=markdown --sort=cover >> "$GITHUB_STEP_SUMMARY"

  integration:
    # A whole CAN session through the CAN hub on a virtual bus: the real
    # Cyphal stack, which the backend unit tests mock. It is the path every
    # adapter other than SocketCAN takes, so it runs on every OS.
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The session compiles and imports the regulated DSDL types.
          submodules: recursive

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r server/requirements.txt

      - name: Compile DSDL
        working-directory: server
        run: python startup_setup.py --recompile

      - name: Run a CAN session through the hub
        run: python tests/integration/hub_session.py

      - name: Run a CAN FD session through the hub
        run: python tests/integration/hub_session.py --fd

      - name: Walk the API of a running server on the simulated bus
        run: python tests/integration/api_walk.py

  e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install Playwright
        run: pip install -r tests/e2e/requirements.txt

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pinned Playwright version: each release expects a
          # specific Chromium build, so a version bump must miss the cache.
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Chromium system dependencies
        # apt packages are not cacheable; this is the smaller half.
        run: playwright install-deps chromium

      - name: Run end-to-end tests
        # The script serves website/ itself and shuts the server down after,
        # so this is one step with no background process crossing a boundary.
        working-directory: tests/e2e
        run: python3 test_landing_page.py

      - name: Upload result summary
        if: always()
        # A convenience copy of the summary; the test step above decides the
        # job. An exhausted artifact storage quota must not fail passing tests.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-result
          path: tests/e2e/result.md
          if-no-files-found: ignore
          retention-days: 7
