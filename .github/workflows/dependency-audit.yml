name: Dependency audit

# Known advisories in what server/requirements.txt resolves to today, once a
# week and on demand: a release bundles what was current on its build day.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.7.3
      - run: pip-audit -r server/requirements.txt
